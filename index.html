<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BacklinkBase — Discover Useful Websites</title><meta name="description" content="Discover useful websites, tools, services and resources."><style>:root{--bg:#070711;--panel:#11111d;--muted:#a3a3b5;--line:#28283a;--p:#7c5cff;--pink:#ff4fd8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#181334,transparent 32%),radial-gradient(circle at 90% 10%,#21102d,transparent 28%),var(--bg);color:#f7f7fb;font-family:Inter,system-ui,sans-serif}a{text-decoration:none;color:inherit}.wrap{max-width:1240px;margin:auto;padding:0 24px}header{position:sticky;top:0;z-index:20;background:#070711c9;backdrop-filter:blur(20px);border-bottom:1px solid #ffffff10}nav{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:900}.brand b{color:#9b89ff}.links{display:flex;gap:26px;align-items:center}.links a{color:#bdbdca;font-size:14px;font-weight:650}.btn{border:0;cursor:pointer;border-radius:12px;padding:12px 18px;color:#fff;font-weight:800;background:linear-gradient(135deg,var(--p),var(--pink));box-shadow:0 10px 30px #7c5cff2e}.hero{padding:105px 0 78px;text-align:center}.eyebrow{display:inline-block;padding:8px 13px;border:1px solid #ffffff15;background:#ffffff08;border-radius:99px;color:#c8c3ff;font-size:12px;font-weight:800;margin-bottom:22px}h1{font-size:clamp(46px,7vw,84px);line-height:.98;letter-spacing:-5px;max-width:900px;margin:0 auto 24px}.hero h1 span{background:linear-gradient(100deg,#fff,#bbaeff,#ff9be9);-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted);font-size:18px;line-height:1.7;max-width:690px;margin:0 auto 34px}.search{display:flex;max-width:780px;margin:auto;padding:7px;background:#11111ddd;border:1px solid #ffffff13;border-radius:16px;box-shadow:0 25px 70px #0008}.search input{min-width:0;flex:1;background:transparent;border:0;outline:0;color:#fff;padding:14px 16px;font:inherit}.section{padding:42px 0}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.head h2{margin:0;font-size:28px}.head p,.muted{color:var(--muted)}.view{color:#b7aaff;font-weight:700}.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.cat{background:linear-gradient(145deg,#141421,#0e0e18);border:1px solid var(--line);border-radius:16px;padding:18px;transition:.25s}.cat:hover,.card:hover{transform:translateY(-4px);border-color:#6d5cff66;box-shadow:0 20px 50px #0006}.cat-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#7c5cff18;color:#b9adff;margin-bottom:14px}.cat b{display:block;font-size:14px}.cat small{display:block;color:#777789;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:linear-gradient(145deg,#14141f,#0e0e17);border:1px solid var(--line);border-radius:18px;padding:20px;transition:.25s}.site{display:flex;gap:13px;align-items:center}.icon{width:48px;height:48px;border-radius:13px;background:#fff;padding:8px;object-fit:contain}.title{font-weight:800}.domain{font-size:12px;color:#777789}.desc{font-size:14px;line-height:1.6;color:#aaaabd}.tag{display:inline-block;padding:6px 9px;border-radius:99px;background:#7c5cff14;color:#afa3ff;font-size:11px;font-weight:800}.card-bottom{display:flex;justify-content:space-between;margin-top:16px}.arrow{color:#9b89ff;font-weight:800}.cta{margin:50px 0;padding:48px;border-radius:25px;border:1px solid #ffffff12;background:linear-gradient(120deg,#17122d,#211129);text-align:center}.cta h2{font-size:34px;margin:0 0 10px}.cta p{color:var(--muted);margin:0 auto 22px;max-width:560px}footer{border-top:1px solid #ffffff0d;padding:38px 0;color:#777789}@media(max-width:900px){.cats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.links{display:none}.cats,.grid{grid-template-columns:1fr 1fr}h1{letter-spacing:-3px}.search{flex-direction:column}.search .btn{width:100%}}</style></head><body><header><div class="wrap"><nav><a class="logo" href="#/">Backlink<b>Base</b></a><div class="links"><a href="#/discover">Discover</a><a href="#/categories">Categories</a><a href="#/blog">Blog</a><a href="#/about">About</a><button class="btn" onclick="submitSite()">Submit Website</button></div></nav></div></header><main id="app"></main><footer><div class="wrap">© 2026 BacklinkBase · Website discovery directory</div></footer><script>const CATS=["AI","Artificial Intelligence","Technology","Software","SaaS","Web Tools","Developer Tools","Programming","Design","Graphics","Marketing","SEO","Business","Finance","E-commerce","Shopping","Education","Learning","News","Media","Entertainment","Games","Gaming","Health","Fitness","Travel","Food","Recipes","Lifestyle","Personal Blogs","Photography","Video","Music","Sports","Jobs","Careers","Real Estate","Construction","Home Improvement","Automotive","Legal","Government","Nonprofit","Communities","Forums","Social","Productivity","Utilities","Internet Services","Hosting","Domains","Security","Cybersecurity","Mobile Apps","Android","iOS","WordPress","Blogging","Newsletters","Online Services","Directories","Reference","Science","Research","Books","Literature","Art","Fashion","Beauty","Parenting","Pets","Shopping Deals","Local Businesses","Startups","Agencies","Freelancers","Portfolios","Other"];const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));const demo=CATS.slice(0,6).map(x=>({title:x+" websites",domain:x.toLowerCase().replace(/ /g,"-")+".example",description:"Discover useful "+x.toLowerCase()+" websites, tools and resources.",category_name:x}));function layout(x){return '<section class="section"><div class="wrap">'+x+'</div></section>'}function card(s){return '<article class="card"><div class="site"><img class="icon" src="https://www.google.com/s2/favicons?domain='+encodeURIComponent(s.domain)+'&sz=128"><div><div class="title">'+esc(s.title)+'</div><div class="domain">'+esc(s.domain)+'</div></div></div><p class="desc">'+esc(s.description)+'</p><span class="tag">'+esc(s.category_name)+'</span></article>'}function home(){app.innerHTML='<section class="hero"><h1>Discover the <span>best of the web.</span></h1><p>Find powerful tools, useful resources, inspiring websites and services — organized so you can discover exactly what you need.</p><div class="search"><input placeholder="Search websites, categories or domains"><button class="btn" onclick="location.hash='/discover'">Search</button></div></section>'+layout('<div class="head"><div><h2>Explore categories</h2><p class="muted">Explore websites by topic.</p></div><a href="#/categories">View all</a></div><div class="cats">'+CATS.slice(0,18).map(x=>'<a class="cat" href="#/discover?category='+encodeURIComponent(x)+'">'+esc(x)+'<small>Explore websites</small></a>').join("")+'</div>')+layout('<div class="head"><div><h2>Featured discovery</h2><p class="muted">Newly approved websites.</p></div><a href="#/discover">Discover all</a></div><div class="grid">'+demo.map(card).join("")+'</div>')}function page(t,b){app.innerHTML=layout('<h1 style="text-align:left;font-size:44px;letter-spacing:-2px">'+t+'</h1>'+b)}function route(){let p=location.hash.slice(1)||'/';if(p==='/')home();else if(p.startsWith('/categories'))page('Categories','<div class="cats">'+CATS.map(x=>'<a class="cat" href="#/discover?category='+encodeURIComponent(x)+'">'+esc(x)+'<small>Explore websites</small></a>').join("")+'</div>');else if(p.startsWith('/discover'))page('Discover websites','<p class="muted">Production data is designed to come from Supabase with database-level filtering and a maximum of 50 results per page.</p><div class="grid">'+demo.map(card).join("")+'</div>');else if(p==='/blog')page('Blog','<p class="muted">Practical guides for finding useful websites, tools and resources.</p>');else if(p==='/about')page('About','<p class="muted">BacklinkBase is a content-driven website discovery platform with moderated submissions.</p>');else page('Page not found','<p class="muted">The requested page does not exist.</p>')}function submitSite(){alert('Submission flow is prepared for the Supabase architecture. Configure the database and secure server-side metadata fetcher before accepting live submissions.')}addEventListener('hashchange',route);route();</script></body></html>
