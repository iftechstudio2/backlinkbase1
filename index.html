<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BacklinkBase — Discover Useful Websites</title><meta name="description" content="Discover useful websites, tools, services and resources."><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f7f8fc;color:#101828}header{background:#fff;border-bottom:1px solid #e4e7ec;position:sticky;top:0}.wrap{max-width:1180px;margin:auto;padding:0 20px}nav{height:68px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:22px;font-weight:900}.logo b{color:#635bff}nav a{margin:0 9px;text-decoration:none;color:#475467;font-weight:700;font-size:14px}.btn{border:0;border-radius:10px;padding:11px 16px;background:#635bff;color:#fff;font-weight:800}.hero{text-align:center;padding:85px 20px;background:radial-gradient(circle at 50% 0,#e9e5ff,transparent 55%)}h1{font-size:clamp(42px,7vw,70px);letter-spacing:-3px;margin:0 auto 18px}.hero p{color:#667085;font-size:18px;max-width:650px;margin:0 auto 28px}.search{display:flex;max-width:720px;margin:auto;background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:7px}.search input{flex:1;border:0;outline:0;padding:13px;font-size:16px}.section{padding:45px 0}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.head h2{margin:0;font-size:28px}.muted{color:#667085}.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.cat{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:15px;text-decoration:none;color:#101828;font-weight:750}.cat small{display:block;color:#667085;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:18px}.site{display:flex;gap:12px;align-items:center}.icon{width:46px;height:46px;border-radius:12px;background:#f2f4f7;object-fit:contain}.title{font-weight:800}.domain{color:#667085;font-size:13px}.desc{color:#475467;line-height:1.55}.tag{display:inline-block;background:#f0edff;color:#5138c9;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:800}footer{border-top:1px solid #e4e7ec;padding:30px 0;color:#667085}@media(max-width:850px){.cats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){nav .links{display:none}.cats,.grid{grid-template-columns:1fr 1fr}.search{flex-direction:column}.search .btn{width:100%}}</style></head><body><header><div class="wrap"><nav><a class="logo" href="#/">Backlink<b>Base</b></a><div class="links"><a href="#/discover">Discover</a><a href="#/categories">Categories</a><a href="#/blog">Blog</a><a href="#/about">About</a><button class="btn" onclick="submitSite()">Submit Website</button></div></nav></div></header><main id="app"></main><footer><div class="wrap">© 2026 BacklinkBase · Website discovery directory</div></footer><script>const CATS=["AI","Artificial Intelligence","Technology","Software","SaaS","Web Tools","Developer Tools","Programming","Design","Graphics","Marketing","SEO","Business","Finance","E-commerce","Shopping","Education","Learning","News","Media","Entertainment","Games","Gaming","Health","Fitness","Travel","Food","Recipes","Lifestyle","Personal Blogs","Photography","Video","Music","Sports","Jobs","Careers","Real Estate","Construction","Home Improvement","Automotive","Legal","Government","Nonprofit","Communities","Forums","Social","Productivity","Utilities","Internet Services","Hosting","Domains","Security","Cybersecurity","Mobile Apps","Android","iOS","WordPress","Blogging","Newsletters","Online Services","Directories","Reference","Science","Research","Books","Literature","Art","Fashion","Beauty","Parenting","Pets","Shopping Deals","Local Businesses","Startups","Agencies","Freelancers","Portfolios","Other"];const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));const demo=CATS.slice(0,6).map(x=>({title:x+" websites",domain:x.toLowerCase().replace(/ /g,"-")+".example",description:"Discover useful "+x.toLowerCase()+" websites, tools and resources.",category_name:x}));function layout(x){return '<section class="section"><div class="wrap">'+x+'</div></section>'}function card(s){return '<article class="card"><div class="site"><img class="icon" src="https://www.google.com/s2/favicons?domain='+encodeURIComponent(s.domain)+'&sz=128"><div><div class="title">'+esc(s.title)+'</div><div class="domain">'+esc(s.domain)+'</div></div></div><p class="desc">'+esc(s.description)+'</p><span class="tag">'+esc(s.category_name)+'</span></article>'}function home(){app.innerHTML='<section class="hero"><h1>Discover useful websites.</h1><p>Find tools, services, resources and interesting websites organized into useful categories.</p><div class="search"><input placeholder="Search websites, categories or domains"><button class="btn" onclick="location.hash='/discover'">Search</button></div></section>'+layout('<div class="head"><div><h2>Browse categories</h2><p class="muted">Explore websites by topic.</p></div><a href="#/categories">View all</a></div><div class="cats">'+CATS.slice(0,18).map(x=>'<a class="cat" href="#/discover?category='+encodeURIComponent(x)+'">'+esc(x)+'<small>Explore websites</small></a>').join("")+'</div>')+layout('<div class="head"><div><h2>Recently discovered</h2><p class="muted">Newly approved websites.</p></div><a href="#/discover">Discover all</a></div><div class="grid">'+demo.map(card).join("")+'</div>')}function page(t,b){app.innerHTML=layout('<h1 style="text-align:left;font-size:44px;letter-spacing:-2px">'+t+'</h1>'+b)}function route(){let p=location.hash.slice(1)||'/';if(p==='/')home();else if(p.startsWith('/categories'))page('Categories','<div class="cats">'+CATS.map(x=>'<a class="cat" href="#/discover?category='+encodeURIComponent(x)+'">'+esc(x)+'<small>Explore websites</small></a>').join("")+'</div>');else if(p.startsWith('/discover'))page('Discover websites','<p class="muted">Production data is designed to come from Supabase with database-level filtering and a maximum of 50 results per page.</p><div class="grid">'+demo.map(card).join("")+'</div>');else if(p==='/blog')page('Blog','<p class="muted">Practical guides for finding useful websites, tools and resources.</p>');else if(p==='/about')page('About','<p class="muted">BacklinkBase is a content-driven website discovery platform with moderated submissions.</p>');else page('Page not found','<p class="muted">The requested page does not exist.</p>')}function submitSite(){alert('Submission flow is prepared for the Supabase architecture. Configure the database and secure server-side metadata fetcher before accepting live submissions.')}addEventListener('hashchange',route);route();</script></body></html>
