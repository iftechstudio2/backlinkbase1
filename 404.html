<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page Not Found — BacklinkBase</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#09090b;color:#f4f4f5;font-family:Inter,system-ui,-apple-system,sans-serif;text-align:center;padding:20px}
    .box{max-width:480px;padding:40px 24px;border:1px solid #27272a;border-radius:16px;background:#141417}
    h1{font-size:64px;margin:0 0 10px;font-weight:900;letter-spacing:-2px;color:#ffffff}
    h2{margin:0 0 12px;font-size:22px;color:#e4e4e7}
    p{color:#a1a1aa;line-height:1.6;font-size:15px;margin:0 0 24px}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 24px;border-radius:10px;color:#09090b;font-weight:700;font-size:14px;text-decoration:none;background:#ffffff;transition:background .15s}
    .btn:hover{background:#e4e4e7}
  </style>
</head>
<body>
  <main class="box">
    <h1>404</h1>
    <h2>Page not found</h2>
    <p>The page you are looking for does not exist or has been moved.</p>
    <a class="btn" href="/">Return to BacklinkBase</a>
  </main>
</body>
</html>
