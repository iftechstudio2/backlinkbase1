<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BacklinkBase Admin</title>
<style>
:root{--bg:#070711;--panel:#11111c;--panel2:#171725;--line:#29293b;--text:#f7f7fb;--muted:#9d9daf;--p:#765cff;--pink:#ff4fd8;--ok:#36d49a;--danger:#ff687f;--warn:#ffc857}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#241653,transparent 28%),radial-gradient(circle at 90% 0,#421536,transparent 25%),var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.wrap{width:min(1450px,100%);margin:auto;padding:0 20px}
.top{height:68px;border-bottom:1px solid #ffffff10;background:#080810ee;position:sticky;top:0;z-index:20}.top .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:20px;font-weight:900}.brand span{color:#a895ff}.user{display:flex;gap:10px;align-items:center}.btn{border:0;border-radius:10px;padding:10px 14px;color:#fff;font-weight:800;background:linear-gradient(135deg,var(--p),var(--pink))}.btn.secondary{background:#ffffff09;border:1px solid var(--line)}.btn.danger{background:#ff687f18;border:1px solid #ff687f35;color:#ff9aaa}.btn.ok{background:#36d49a18;border:1px solid #36d49a35;color:#78e7ba}.btn.warn{background:#ffc85718;border:1px solid #ffc85735;color:#ffe09a}.btn:disabled{opacity:.5;cursor:not-allowed}
.login{min-height:100vh;display:grid;place-items:center;padding:25px}.login-card{width:min(430px,100%);background:#11111cdd;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 25px 80px #0008}.login-card h1{margin:0 0 8px;font-size:32px}.muted{color:var(--muted);line-height:1.6}.form{display:grid;gap:14px;margin-top:22px}.form label{display:grid;gap:7px;font-weight:750;color:#ddd}.form input,.form textarea,.form select,.search{width:100%;background:#0b0b14;border:1px solid var(--line);color:#fff;border-radius:10px;padding:12px;outline:0}.notice{padding:11px 13px;border-radius:10px;margin-top:12px}.err{background:#ff687f12;border:1px solid #ff687f30;color:#ff9aaa}.ok{background:#36d49a12;border:1px solid #36d49a30;color:#7ce9bd}
main{padding:28px 0 60px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.stat{background:linear-gradient(145deg,#141421,#0d0d16);border:1px solid var(--line);border-radius:15px;padding:17px}.stat b{font-size:27px;display:block}.stat small{color:var(--muted)}
.tabs{display:flex;gap:8px;overflow:auto;margin:25px 0 15px;padding-bottom:2px}.tab{white-space:nowrap;background:#ffffff07;border:1px solid var(--line);color:#aaaabd;border-radius:10px;padding:10px 13px}.tab.active{background:linear-gradient(135deg,#765cff30,#ff4fd820);color:#fff;border-color:#765cff70}
.toolbar{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap}.toolbar .search{max-width:420px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px}.item{padding:17px;border-bottom:1px solid #ffffff0b;background:#11111c}.item:last-child{border-bottom:0}.item-head{display:flex;justify-content:space-between;gap:14px}.title{font-weight:850;font-size:16px}.domain{font-size:12px;color:#858597;margin-top:4px;overflow-wrap:anywhere}.desc{color:#aaaabc;line-height:1.5;margin:10px 0}.meta{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.badge{padding:5px 8px;border-radius:99px;background:#ffffff08;color:#bbbacc;font-size:11px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.empty{padding:50px;text-align:center;color:var(--muted)}.pagination{display:flex;justify-content:center;gap:10px;align-items:center;padding:18px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:20px;z-index:50}.modal.open{display:grid}.modal-card{width:min(500px,100%);background:#11111c;border:1px solid var(--line);border-radius:18px;padding:22px}.close{float:right;background:none;border:0;color:#aaa;font-size:22px}.domain-row{display:flex;gap:8px;margin-top:12px}.domain-row input{flex:1}.small{font-size:12px;color:var(--muted)}
@media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.wrap{padding:0 13px}.stats{grid-template-columns:repeat(2,1fr)}.top{height:auto;padding:12px 0}.top .wrap{height:auto;align-items:flex-start}.user{flex-wrap:wrap;justify-content:flex-end}.item-head{display:block}.actions .btn{flex:1;min-width:105px}.toolbar>*{width:100%;max-width:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const SB="https://trjrqfpxxfadxeabvtvf.supabase.co",KEY="sb_publishable_syWcZtTdkXtgcdrc4-2aag_1cL9bCvM",API=SB+"/functions/v1/admin-directory";
let token=localStorage.getItem("bb_admin_token")||"",email=localStorage.getItem("bb_admin_email")||"",tab="pending",page=1,total=0,q="";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function login(e){e.preventDefault();const b=new URLSearchParams();b.set("email",document.getElementById("email").value.trim());b.set("password",document.getElementById("password").value);const box=document.getElementById("loginMsg");box.innerHTML="Signing in…";try{const r=await fetch(SB+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:b});const j=await r.json();if(!r.ok)throw Error(j.error_description||j.msg||"Login failed");token=j.access_token;email=j.user?.email||b.get("email");localStorage.setItem("bb_admin_token",token);localStorage.setItem("bb_admin_email",email);render();}catch(x){box.innerHTML='<div class="notice err">'+esc(x.message)+'</div>'}}
function logout(){token="";localStorage.removeItem("bb_admin_token");localStorage.removeItem("bb_admin_email");render()}
async function api(action,data={}){const r=await fetch(API,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({action,...data})});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error==="forbidden"?"This account is not an admin.":j.error||"Request failed");return j}
function loginView(){root.innerHTML='<div class="login"><div class="login-card"><div class="brand">Backlink<span>Base</span> Admin</div><h1>Secure dashboard</h1><p class="muted">Sign in with the Supabase Auth account that has been added to the BacklinkBase admin list.</p><form class="form" onsubmit="login(event)"><label>Email<input id="email" type="email" autocomplete="username" required value="'+esc(email)+'"></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="btn">Sign in</button><div id="loginMsg"></div></form></div></div>'}
async function loadStats(){try{const x=await api("stats");document.querySelectorAll("[data-stat]").forEach(el=>el.textContent=x.stats[el.dataset.stat]??0)}catch(e){if(/admin|unauthorized/i.test(e.message))logout()}}
async function loadSites(){const box=document.getElementById("list");box.innerHTML='<div class="empty">Loading…</div>';try{const x=await api("sites",{status:tab,page,per_page:25,q});total=x.total;box.innerHTML=x.items.length?x.items.map(siteItem).join(""):'<div class="empty">No '+esc(tab)+' websites.</div>';document.getElementById("pages").innerHTML=pages();}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function siteItem(s){const cat=s.categories?.name||"Uncategorized";return '<div class="item"><div class="item-head"><div><div class="title">'+esc(s.title||s.domain)+'</div><div class="domain">'+esc(s.domain)+' · '+esc(s.url)+'</div></div><span class="badge">'+esc(cat)+'</span></div><div class="desc">'+esc(s.description||"No description")+'</div><div class="meta"><span class="badge">Submitted '+new Date(s.submitted_at).toLocaleString()+'</span>'+ (s.reviewed_at?'<span class="badge">Reviewed '+new Date(s.reviewed_at).toLocaleString()+'</span>':'')+(s.rejection_reason?'<span class="badge">'+esc(s.rejection_reason)+'</span>':'')+'</div><div class="actions">'+(s.status!=="approved"?'<button class="btn ok" onclick="siteStatus(\''+s.id+'\',\'approved\')">Approve</button>':'')+(s.status!=="rejected"?'<button class="btn warn" onclick="siteStatus(\''+s.id+'\',\'rejected\')">Reject</button>':'')+(s.status!=="disabled"?'<button class="btn secondary" onclick="siteStatus(\''+s.id+'\',\'disabled\')">Disable</button>':'')+(s.status!=="pending"?'<button class="btn secondary" onclick="siteStatus(\''+s.id+'\',\'pending\')">Set Pending</button>':'')+'<a class="btn secondary" target="_blank" rel="noopener" href="'+esc(s.url)+'">Visit</a><button class="btn danger" onclick="deleteSite(\''+s.id+'\')">Delete</button></div></div>'}
async function siteStatus(id,status){let reason="";if(status==="rejected"||status==="disabled"){reason=prompt("Reason (optional):")||""}try{await api("site_status",{id,status,reason});await Promise.all([loadStats(),loadSites()])}catch(e){alert(e.message)}}
async function deleteSite(id){if(!confirm("Permanently delete this website and its related directory data?"))return;try{await api("delete_site",{id});await Promise.all([loadStats(),loadSites()])}catch(e){alert(e.message)}}
async function comments(){const box=document.getElementById("list");box.innerHTML='<div class="empty">Loading…</div>';try{const x=await api("comments",{status:tab==="comments_pending"?"pending":tab==="comments_approved"?"approved":tab==="comments_rejected"?"rejected":"blocked"});box.innerHTML=x.items.length?x.items.map(c=>'<div class="item"><div class="title">'+esc(c.sites?.title||c.sites?.domain||"Website")+'</div><div class="domain">'+esc(c.sites?.domain||"")+'</div><p class="desc">'+esc(c.body)+'</p><div class="meta"><span class="badge">'+new Date(c.created_at).toLocaleString()+'</span></div><div class="actions">'+(c.status!=="approved"?'<button class="btn ok" onclick="commentStatus(\''+c.id+'\',\'approved\')">Approve</button>':'')+(c.status!=="rejected"?'<button class="btn warn" onclick="commentStatus(\''+c.id+'\',\'rejected\')">Reject</button>':'')+(c.status!=="blocked"?'<button class="btn danger" onclick="commentStatus(\''+c.id+'\',\'blocked\')">Block</button>':'')+'</div></div>').join(""):'<div class="empty">No comments in this queue.</div>'}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function commentStatus(id,status){const reason=(status==="rejected"||status==="blocked")?(prompt("Reason (optional):")||""):"";try{await api("comment_status",{id,status,reason});loadStats();comments()}catch(e){alert(e.message)}}
async function domains(){const x=await api("domains");document.getElementById("list").innerHTML='<div class="item"><div class="title">Blocked domains</div><div class="domain-row"><input id="newDomain" class="search" placeholder="example.com"><button class="btn" onclick="blockDomain()">Block domain</button></div></div>'+(x.items.length?x.items.map(d=>'<div class="item"><div class="item-head"><div><div class="title">'+esc(d.domain)+'</div><div class="domain">'+esc(d.reason)+'</div></div><button class="btn ok" onclick="unblockDomain(\''+esc(d.domain)+'\')">Unblock</button></div></div>').join(""):'<div class="empty">No blocked domains.</div>')}
async function blockDomain(){const d=document.getElementById("newDomain").value.trim();if(!d)return;try{await api("block_domain",{domain:d});domains();loadStats()}catch(e){alert(e.message)}}
async function unblockDomain(d){if(!confirm("Unblock "+d+"?"))return;try{await api("unblock_domain",{domain:d});domains();loadStats()}catch(e){alert(e.message)}}
async function clients(){const x=await api("clients");document.getElementById("list").innerHTML=x.items.length?x.items.map(c=>'<div class="item"><div class="item-head"><div><div class="title">Blocked client</div><div class="domain">'+esc(c.client_hash)+'</div><div class="small">'+esc(c.reason)+' · until '+esc(c.blocked_until||"indefinite")+'</div></div><button class="btn ok" onclick="unblockClient(\''+esc(c.client_hash)+'\')">Unblock</button></div></div>').join(""):'<div class="empty">No blocked clients.</div>'}
async function unblockClient(h){try{await api("unblock_client",{client_hash:h});clients()}catch(e){alert(e.message)}}
function pages(){const n=Math.max(1,Math.ceil(total/25));if(n<=1)return "";let s="";for(let i=1;i<=n;i++)s+='<button class="tab '+(i===page?'active':'')+'" onclick="page='+i+';loadSites()">'+i+'</button>';return s}
function selectTab(t){tab=t;page=1;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));const el=document.querySelector('[data-tab="'+t+'"]');if(el)el.classList.add("active");if(t.startsWith("comments"))comments();else if(t==="domains")domains();else if(t==="clients")clients();else loadSites()}
function dashboard(){root.innerHTML='<header class="top"><div class="wrap"><a class="brand" href="/">Backlink<span>Base</span> Admin</a><div class="user"><span class="small">'+esc(email)+'</span><a class="btn secondary" href="https://backlinkbase.org/" target="_blank">View site</a><button class="btn secondary" onclick="logout()">Sign out</button></div></div></header><main><div class="wrap"><div class="stats"><div class="stat"><b data-stat="pending">—</b><small>Pending websites</small></div><div class="stat"><b data-stat="approved">—</b><small>Approved websites</small></div><div class="stat"><b data-stat="rejected">—</b><small>Rejected</small></div><div class="stat"><b data-stat="disabled">—</b><small>Disabled</small></div><div class="stat"><b data-stat="pending_comments">—</b><small>Pending comments</small></div><div class="stat"><b data-stat="blocked_domains">—</b><small>Blocked domains</small></div></div><div class="tabs"><button data-tab="pending" class="tab active" onclick="selectTab(\'pending\')">Websites: Pending</button><button data-tab="approved" class="tab" onclick="selectTab(\'approved\')">Approved</button><button data-tab="rejected" class="tab" onclick="selectTab(\'rejected\')">Rejected</button><button data-tab="disabled" class="tab" onclick="selectTab(\'disabled\')">Disabled</button><button data-tab="comments_pending" class="tab" onclick="selectTab(\'comments_pending\')">Comments: Pending</button><button data-tab="comments_approved" class="tab" onclick="selectTab(\'comments_approved\')">Comments: Approved</button><button data-tab="comments_rejected" class="tab" onclick="selectTab(\'comments_rejected\')">Comments: Rejected</button><button data-tab="comments_blocked" class="tab" onclick="selectTab(\'comments_blocked\')">Comments: Blocked</button><button data-tab="domains" class="tab" onclick="selectTab(\'domains\')">Blocked Domains</button><button data-tab="clients" class="tab" onclick="selectTab(\'clients\')">Blocked Clients</button></div><div class="toolbar"><input id="q" class="search" placeholder="Search title, domain or URL" onkeydown="if(event.key==='Enter'){q=this.value.trim();page=1;loadSites()}"><button class="btn secondary" onclick="q=document.getElementById('q').value.trim();page=1;loadSites()">Search</button><button class="btn secondary" onclick="loadStats();tab.startsWith('comments')?comments():tab==='domains'?domains():tab==='clients'?clients():loadSites()">Refresh</button></div><div id="list" class="table-wrap"></div><div id="pages" class="pagination"></div></div></main>';loadStats();loadSites()}
function render(){token?dashboard():loginView()}render();
</script>
</body></html>
