t:1.5}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.empty{text-align:center;padding:40px;color:#898b9b}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#1b1c27;color:#aaa;font-size:11px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.itemhead{display:block}.toolbar{flex-wrap:wrap}.toolbar input{width:100%;flex-basis:100%}}

</style></head><body><div class="login-page">
  <div class="login-shell">
    <div class="login-brand"><span>Backlink</span>Base</div>
    <div class="login-badge">ADMIN PORTAL</div>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to manage websites, comments, domains and submissions.</p>
    <form id="loginForm">
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" placeholder="admin@example.com" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required></div>
      <button class="btn primary login-btn" type="submit">Sign in <span>→</span></button>
      <div id="loginError"></div>
    </form>
    <div class="login-foot">BacklinkBase secure administration</div>
  </div>
</div><script>
const SB="https://trjrqfpxxfadxeabvtvf.supabase.co";
const KEY="sb_publishable_syWcZtTdkXtgcdrc4-2aag_1cL9bCvM";
async function login(ev){
  ev.preventDefault();
  const error=document.getElementById("loginError");
  const button=document.querySelector(".login-btn");
  error.textContent=""; button.disabled=true; button.innerHTML="Signing in…";
  try{
    const body={email:document.getElementById("email").value.trim(),password:document.getElementById("password").value};
    const r=await fetch(SB+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json();
    if(!r.ok) throw Error(j.error_description||j.msg||"Login failed");
    localStorage.setItem("bb_admin_token",j.access_token);
    localStorage.setItem("bb_admin_email",j.user?.email||body.email);
    location.href="/admin/dashboard/";
  }catch(e){
    error.innerHTML='<div class="err">'+String(e.message).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))+'</div>';
    button.disabled=false; button.innerHTML='Sign in <span>→</span>';
  }
}
document.getElementById("loginForm").addEventListener("submit",login);
</script></body></html>
