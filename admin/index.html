<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>BacklinkBase Admin — Sign in</title>
  <style>
    *{box-sizing:border-box}
    :root{color-scheme:dark}
    body{margin:0;min-height:100vh;background:#09090b;color:#f4f4f5;font-family:Inter,system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:24px}
    .login-shell{width:min(440px,100%);padding:36px;background:#141417;border:1px solid #27272a;border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
    .login-brand{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:20px;color:#ffffff}
    .login-brand span{color:#a1a1aa}
    .login-badge{display:inline-flex;padding:5px 10px;border-radius:999px;background:#27272a;color:#e4e4e7;border:1px solid #3f3f46;font-size:10px;font-weight:800;letter-spacing:1px;margin-bottom:14px}
    h1{font-size:28px;letter-spacing:-1px;margin:0 0 8px;color:#ffffff}
    .muted{color:#a1a1aa;font-size:14px;margin-bottom:24px;line-height:1.5}
    .field{margin:16px 0;display:grid;gap:6px}
    .field label{font-weight:600;font-size:13px;color:#d4d4d8}
    .field input{background:#09090b;border:1px solid #27272a;padding:13px 14px;border-radius:10px;font-size:14px;color:#ffffff;outline:none}
    .field input:focus{border-color:#71717a}
    .login-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;font-size:15px;margin-top:16px;background:#ffffff;color:#09090b;border:none;border-radius:10px;font-weight:700;cursor:pointer;transition:background .15s}
    .login-btn:hover{background:#e4e4e7}
    .login-btn:disabled{opacity:.6;cursor:not-allowed}
    .err{color:#f87171;background:#261315;border:1px solid #451b1f;padding:12px;border-radius:9px;margin:12px 0;font-size:13px}
    .login-foot{margin-top:24px;padding-top:16px;border-top:1px solid #27272a;color:#71717a;font-size:12px;text-align:center}
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="login-brand">Backlink<span>Base</span></div>
    <div class="login-badge">ADMIN PORTAL</div>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to moderate submissions and manage directory websites.</p>
    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" placeholder="admin@backlinkbase.org" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button class="login-btn" type="submit">Sign in <span>→</span></button>
      <div id="loginError"></div>
    </form>
    <div class="login-foot">BacklinkBase Secure Administration</div>
  </div>

  <script>
    const SB = "https://trjrqfpxxfadxeabvtvf.supabase.co";
    const KEY = "sb_publishable_syWcZtTdkXtgcdrc4-2aag_1cL9bCvM";
    async function login(ev){
      ev.preventDefault();
      const error = document.getElementById("loginError");
      const button = document.querySelector(".login-btn");
      error.textContent = ""; button.disabled = true; button.innerHTML = "Signing in…";
      try {
        const body = {
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        };
        const r = await fetch(SB + "/auth/v1/token?grant_type=password", {
          method: "POST",
          headers: { apikey: KEY, "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const j = await r.json();
        if (!r.ok) throw Error(j.error_description || j.msg || "Login failed");
        localStorage.setItem("bb_admin_token", j.access_token);
        localStorage.setItem("bb_admin_email", j.user?.email || body.email);
        location.href = "/admin/dashboard/";
      } catch(e) {
        error.innerHTML = '<div class="err">' + String(e.message).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])) + '</div>';
        button.disabled = false; button.innerHTML = 'Sign in <span>→</span>';
      }
    }
    document.getElementById("loginForm").addEventListener("submit", login);
  </script>
</body>
</html>
