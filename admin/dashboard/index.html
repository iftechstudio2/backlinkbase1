<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin Dashboard — BacklinkBase</title>
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    :root{color-scheme:dark}
    body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;margin:0}
    .admin-nav{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:var(--bg-subtle);border-bottom:1px solid var(--border)}
    .admin-wrap{max-width:1200px;margin:24px auto;padding:0 16px;width:100%}
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
    .stat-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
    .stat-card .num{font-size:28px;font-weight:800;color:var(--text);margin:6px 0 0}
    .stat-card .lbl{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
    .table-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;overflow-x:auto}
    .table-resp{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{width:100%;min-width:600px;border-collapse:collapse;text-align:left}
    th{padding:12px 14px;color:var(--text-muted);font-size:12px;text-transform:uppercase;border-bottom:1px solid var(--border)}
    td{padding:14px;border-bottom:1px solid var(--border-subtle);font-size:13.5px}
    .act-btn{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;border:0;cursor:pointer;margin-right:4px;margin-bottom:4px}
    .act-approve{background:#10b981;color:#fff}
    .act-reject{background:#ef4444;color:#fff}
    .act-del{background:#4b5563;color:#fff}
    .pill-status{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase}
    .pill-pending{background:#3b2d14;color:#fbbf24}
    .pill-approved{background:#143427;color:#34d399}
    .pill-rejected{background:#3b181e;color:#f87171}
    @media(max-width:600px){
      .stats-grid{grid-template-columns:1fr 1fr}
      .admin-nav{flex-direction:column;gap:12px;align-items:flex-start}
    }
  </style>
</head>
<body>
  <header class="admin-nav">
    <div class="brand">Backlink<span>Base</span> <small style="font-size:12px;color:var(--primary);font-weight:700">ADMIN</small></div>
    <div style="display:flex;align-items:center;gap:12px;width:100%;justify-content:space-between">
      <button type="button" class="theme-btn themeToggleBtn">☀️ Light</button>
      <button class="btn secondary" onclick="logout()" style="padding:6px 12px;font-size:12px">Sign Out</button>
    </div>
  </header>

  <main class="admin-wrap">
    <div class="stats-grid">
      <div class="stat-card"><div class="lbl">Total Sites</div><div class="num" id="statTotal">-</div></div>
      <div class="stat-card"><div class="lbl">Pending Review</div><div class="num" id="statPending" style="color:#fbbf24">-</div></div>
      <div class="stat-card"><div class="lbl">Approved</div><div class="num" id="statApproved" style="color:#34d399">-</div></div>
      <div class="stat-card"><div class="lbl">Categories</div><div class="num" id="statCategories">-</div></div>
    </div>

    <div class="table-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">
        <h2 style="margin:0;font-size:18px">Website Submissions</h2>
        <div style="display:flex;gap:10px;width:100%;max-width:300px">
          <select id="filterStatus" onchange="loadSites()" style="flex:1;background:var(--bg-subtle);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:8px">
            <option value="pending">Pending Only</option>
            <option value="approved">Approved</option>
            <option value="all">All Sites</option>
          </select>
          <button class="btn primary" onclick="loadSites()" style="padding:8px 14px;font-size:13px">Refresh</button>
        </div>
      </div>

      <div class="table-resp">
        <table>
          <thead>
            <tr>
              <th>Website</th>
              <th>Domain</th>
              <th>Category</th>
              <th>Status</th>
              <th>Submitted</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="sitesTbody">
            <tr><td colspan="6" style="text-align:center;padding:24px">Loading submissions...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/assets/app.js"></script>
  <script>
    const token = localStorage.getItem("bb_admin_token");
    if (!token) location.href = "/admin/";

    async function req(action, data = {}) {
      const r = await fetch(API, {
        method: "POST",
        headers: {
          "apikey": KEY,
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ action, ...data })
      });
      if (!r.ok) {
        if (r.status === 401) {
          localStorage.removeItem("bb_admin_token");
          location.href = "/admin/";
        }
        throw new Error(await r.text());
      }
      return r.json();
    }

    function logout() {
      localStorage.removeItem("bb_admin_token");
      location.href = "/admin/";
    }

    async function loadStats() {
      try {
        const d = await req("stats");
        document.getElementById("statTotal").textContent = d.total;
        document.getElementById("statPending").textContent = d.pending;
        document.getElementById("statApproved").textContent = d.approved;
        document.getElementById("statCategories").textContent = d.categories;
      } catch(e) { console.error(e); }
    }

    async function loadSites() {
      const status = document.getElementById("filterStatus").value;
      const tbody = document.getElementById("sitesTbody");
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:20px">Loading...</td></tr>';
      try {
        const res = await req("list", { status });
        const sites = res.sites || [];
        if (!sites.length) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--text-muted)">No websites in this status.</td></tr>';
          return;
        }
        tbody.innerHTML = sites.map(s => `
          <tr>
            <td><b>${escapeHtml(s.title || s.domain)}</b></td>
            <td><a href="${escapeHtml(s.url)}" target="_blank" style="color:var(--primary)">${escapeHtml(s.domain)}</a></td>
            <td>${escapeHtml(s.categories?.name || "-")}</td>
            <td><span class="pill-status pill-${s.status}">${s.status}</span></td>
            <td style="color:var(--text-muted);font-size:12px">${new Date(s.submitted_at || s.created_at).toLocaleDateString()}</td>
            <td>
              ${s.status !== 'approved' ? `<button class="act-btn act-approve" onclick="updateSite('${s.id}', 'approved')">Approve</button>` : ''}
              ${s.status !== 'rejected' ? `<button class="act-btn act-reject" onclick="updateSite('${s.id}', 'rejected')">Reject</button>` : ''}
              <button class="act-btn act-del" onclick="deleteSite('${s.id}')">Delete</button>
            </td>
          </tr>
        `).join("");
      } catch(e) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#ef4444">${escapeHtml(e.message)}</td></tr>`;
      }
    }

    async function updateSite(id, status) {
      try {
        await req("update_status", { id, status });
        loadStats();
        loadSites();
      } catch(e) { alert("Error: " + e.message); }
    }

    async function deleteSite(id) {
      if (!confirm("Are you sure you want to delete this listing?")) return;
      try {
        await req("delete", { id });
        loadStats();
        loadSites();
      } catch(e) { alert("Error: " + e.message); }
    }

    function escapeHtml(str) {
      return String(str || "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[m]));
    }

    loadStats();
    loadSites();
  </script>
</body>
</html>
