<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BacklinkBase Admin — Dashboard</title><style>
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:#080910;color:#f5f5fa;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1200px;margin:auto;padding:20px}.top{border-bottom:1px solid #252633;background:#0d0e15;position:sticky;top:0}.topin{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:20px;font-weight:800}.brand span{color:#8067ff}.btn{border:1px solid #303140;background:#151621;color:#fff;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}.btn.primary{background:#7057ff;border-color:#7057ff}.btn.ok{background:#123c2d;border-color:#276f53}.btn.danger{background:#421d26;border-color:#71303e}.btn:disabled{opacity:.5}.card{background:#10111a;border:1px solid #282a38;border-radius:16px;padding:22px}[hidden]{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(420px,100%)}h1{margin:0 0 8px}h2{margin:0 0 14px}.muted{color:#9b9dac;line-height:1.5}.field{display:grid;gap:6px;margin:14px 0}.field input{width:100%;padding:12px;border-radius:9px;border:1px solid #303140;background:#090a10;color:#fff}.err{color:#ff9aa9;background:#32151c;border:1px solid #622633;padding:10px;border-radius:9px;margin:10px 0}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:20px 0}.stat{background:#10111a;border:1px solid #282a38;border-radius:12px;padding:15px}.stat b{display:block;font-size:25px}.stat small{color:#9294a5}.tabs{display:flex;gap:7px;overflow:auto;margin:18px 0}.tab{white-space:nowrap}.tab.active{background:#7057ff;border-color:#7057ff}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar input{flex:1}.item{background:#10111a;border:1px solid #282a38;border-radius:12px;padding:16px;margin:9px 0}.itemhead{display:flex;justify-content:space-between;gap:10px}.title{font-size:16px;font-weight:800}.domain{color:#858898;font-size:12px;word-break:break-all;margin-top:4px}.desc{color:#aaacbc;line-height:1.5}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.empty{text-align:center;padding:40px;color:#898b9b}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#1b1c27;color:#aaa;font-size:11px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.itemhead{display:block}.toolbar{flex-wrap:wrap}.toolbar input{width:100%;flex-basis:100%}}

:root{color-scheme:dark}
body{background:#080910}
.top{backdrop-filter:blur(14px);z-index:10}
.topin{min-height:66px}.brand{letter-spacing:-.5px}
.admin-shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 66px)}
.sidebar{border-right:1px solid #242633;background:#0c0d14;padding:18px 12px;position:sticky;top:66px;height:calc(100vh - 66px)}
.side-label{text-transform:uppercase;font-size:10px;font-weight:800;letter-spacing:1px;color:#6f7180;padding:10px 10px 7px}
.side-btn{display:block;width:100%;text-align:left;background:transparent;border:0;color:#aeb0bd;border-radius:9px;padding:10px;font-weight:650;cursor:pointer;margin:2px 0}
.side-btn.active,.side-btn:hover{background:#19172a;color:#fff}
.dashboard-main{padding:26px;min-width:0}
.page-title{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:22px}.page-title h1{font-size:28px;letter-spacing:-.8px;margin:0}.page-title p{margin:5px 0 0;color:#858898}
.stats{margin:0 0 22px}.stat{padding:17px}.stat b{font-size:28px}
.tabs{margin:0 0 16px;border-bottom:1px solid #242633;padding-bottom:10px}
.toolbar{margin-bottom:16px}.toolbar input{min-width:0}
.item{box-shadow:0 5px 20px rgba(0,0,0,.12)}
@media(max-width:850px){.admin-shell{grid-template-columns:1fr}.sidebar{display:none}.dashboard-main{padding:18px}.page-title{display:block}}
</style></head><body><div id="app">
<header class="top"><div class="wrap topin"><div class="brand">Backlink<span>Base</span> Admin</div><div><span id="userEmail" class="muted"></span> <button id="logout" class="btn">Sign out</button></div></div></header>
<div class="admin-shell">
<aside class="sidebar">
<div class="side-label">Workspace</div>
<button class="side-btn active" onclick="currentTab='pending';currentPage=1;load()">Websites</button>
<button class="side-btn" onclick="currentTab='comments_pending';currentPage=1;load()">Comments</button>
<button class="side-btn" onclick="currentTab='domains';currentPage=1;load()">Blocked domains</button>
<button class="side-btn" onclick="currentTab='clients';currentPage=1;load()">Blocked clients</button>
<div class="side-label">System</div>
<button class="side-btn" onclick="load()">Refresh data</button>
<button class="side-btn" onclick="logout()">Sign out</button>
</aside>
<main class="dashboard-main">
<div class="page-title"><div><h1>Dashboard</h1><p>Manage your BacklinkBase directory from one place.</p></div></div>
<div class="stats">
<div class="stat"><b id="sPending">—</b><small>Pending</small></div><div class="stat"><b id="sApproved">—</b><small>Approved</small></div><div class="stat"><b id="sRejected">—</b><small>Rejected</small></div><div class="stat"><b id="sDisabled">—</b><small>Disabled</small></div><div class="stat"><b id="sComments">—</b><small>Pending comments</small></div><div class="stat"><b id="sDomains">—</b><small>Blocked domains</small></div>
</div>
<div id="tabs" class="tabs"></div>
<div class="toolbar"><input id="search" class="field" placeholder="Search title, domain or URL"><button id="searchBtn" class="btn">Search</button><button id="refresh" class="btn">Refresh</button></div>
<div id="list"></div>
</main></div></div><script>
const SB="https://trjrqfpxxfadxeabvtvf.supabase.co";
const KEY="sb_publishable_syWcZtTdkXtgcdrc4-2aag_1cL9bCvM";
const API=SB+"/functions/v1/admin-directory";
let token=localStorage.getItem("bb_admin_token")||"", currentTab="pending", currentPage=1, query="";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(action,data={}){const r=await fetch(API,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({action,...data})});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error==="forbidden"?"This account is not an admin.":j.error||"Request failed");return j;}
function logout(){token="";localStorage.removeItem("bb_admin_token");localStorage.removeItem("bb_admin_email");showLogin();}
async function stats(){const j=await api("stats");$("sPending").textContent=j.stats.pending;$("sApproved").textContent=j.stats.approved;$("sRejected").textContent=j.stats.rejected;$("sDisabled").textContent=j.stats.disabled;$("sComments").textContent=j.stats.pending_comments;$("sDomains").textContent=j.stats.blocked_domains;}
function makeTabs(){const tabs=[["pending","Pending websites"],["approved","Approved"],["rejected","Rejected"],["disabled","Disabled"],["comments_pending","Pending comments"],["comments_approved","Approved comments"],["comments_rejected","Rejected comments"],["comments_blocked","Blocked comments"],["domains","Blocked domains"],["clients","Blocked clients"]];$("tabs").innerHTML="";tabs.forEach(([id,label])=>{const b=document.createElement("button");b.className="btn tab"+(id===currentTab?" active":"");b.textContent=label;b.onclick=()=>{currentTab=id;currentPage=1;load();};$("tabs").appendChild(b);});}
async function load(){makeTabs();$("list").innerHTML='<div class="empty">Loading…</div>';try{await stats();if(currentTab.startsWith("comments_"))return await loadComments();if(currentTab==="domains")return await loadDomains();if(currentTab==="clients")return await loadClients();const j=await api("sites",{status:currentTab,page:currentPage,per_page:25,q:query});renderSites(j.items||[]);}catch(e){if(/unauthorized|admin/i.test(e.message)){logout();return}$("list").innerHTML='<div class="err">'+esc(e.message)+'</div>';}}
function renderSites(items){if(!items.length){$("list").innerHTML='<div class="empty">No websites found.</div>';return}$("list").innerHTML=items.map(s=>'<div class="item"><div class="itemhead"><div><div class="title">'+esc(s.title||s.domain)+'</div><div class="domain">'+esc(s.domain||"")+' · '+esc(s.url||"")+'</div></div><span class="badge">'+esc(s.categories?.name||"Uncategorized")+'</span></div><p class="desc">'+esc(s.description||"No description")+'</p><div class="actions">'+(s.status!=="approved"?'<button class="btn ok" data-action="approve" data-id="'+esc(s.id)+'">Approve</button>':"")+(s.status!=="rejected"?'<button class="btn" data-action="reject" data-id="'+esc(s.id)+'">Reject</button>':"")+(s.status!=="disabled"?'<button class="btn" data-action="disable" data-id="'+esc(s.id)+'">Disable</button>':"")+'<a class="btn" target="_blank" href="'+esc(s.url||"#")+'">Visit</a><button class="btn danger" data-action="delete" data-id="'+esc(s.id)+'">Delete</button></div></div>').join("");}
async function siteAction(id,status){let reason="";if(status==="rejected"||status==="disabled")reason=prompt("Reason (optional)")||"";await api("site_status",{id,status,reason});await load();}
async function loadComments(){const status=currentTab==="comments_pending"?"pending":currentTab==="comments_approved"?"approved":currentTab==="comments_rejected"?"rejected":"blocked";const j=await api("comments",{status});$("list").innerHTML=(j.items||[]).map(c=>'<div class="item"><div class="title">'+esc(c.sites?.title||c.sites?.domain||"Website")+'</div><div class="domain">'+esc(c.sites?.domain||"")+'</div><p class="desc">'+esc(c.body)+'</p><div class="actions"><button class="btn ok" data-comment="approved" data-id="'+esc(c.id)+'">Approve</button><button class="btn" data-comment="rejected" data-id="'+esc(c.id)+'">Reject</button><button class="btn danger" data-comment="blocked" data-id="'+esc(c.id)+'">Block</button></div></div>').join("")||'<div class="empty">No comments.</div>';}
async function loadDomains(){const j=await api("domains");$("list").innerHTML='<div class="item"><input id="domainInput" class="field" placeholder="example.com"><button class="btn primary" id="blockDomain">Block domain</button></div>'+(j.items||[]).map(d=>'<div class="item"><div class="itemhead"><div><div class="title">'+esc(d.domain)+'</div><div class="domain">'+esc(d.reason)+'</div></div><button class="btn ok" data-unblock="'+esc(d.domain)+'">Unblock</button></div></div>').join("")||'<div class="empty">No blocked domains.</div>';}
async function loadClients(){const j=await api("clients");$("list").innerHTML=(j.items||[]).map(c=>'<div class="item"><div class="itemhead"><div><div class="title">Blocked client</div><div class="domain">'+esc(c.client_hash)+'</div><div class="muted">'+esc(c.reason||"")+'</div></div><button class="btn ok" data-client="'+esc(c.client_hash)+'">Unblock</button></div></div>').join("")||'<div class="empty">No blocked clients.</div>';}
$("logout").addEventListener("click",logout);
$("searchBtn").onclick=()=>{query=$("search").value.trim();currentPage=1;load();};
$("refresh").onclick=()=>load();
$("list").addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;try{if(b.dataset.action==="delete"){if(confirm("Permanently delete this website?"))await api("delete_site",{id:b.dataset.id});}else if(b.dataset.action){await siteAction(b.dataset.id,b.dataset.action==="approve"?"approved":b.dataset.action==="reject"?"rejected":"disabled");return;}else if(b.dataset.comment){const reason=(b.dataset.comment==="rejected"||b.dataset.comment==="blocked")?(prompt("Reason (optional)")||""):"";await api("comment_status",{id:b.dataset.id,status:b.dataset.comment,reason});}else if(b.dataset.unblock){await api("unblock_domain",{domain:b.dataset.unblock});}else if(b.dataset.client){await api("unblock_client",{client_hash:b.dataset.client});}else if(b.id==="blockDomain"){const d=$("domainInput").value.trim();if(d)await api("block_domain",{domain:d});}await load();}catch(err){alert(err.message);}});
if(token){$("userEmail").textContent=localStorage.getItem("bb_admin_email")||"";load().catch(()=>logout());}else{location.href="/admin/";}
</script></body></html>
